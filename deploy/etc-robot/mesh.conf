# Mesh network reference values, Section 8.9/8.14.5.1.
# Not read directly by any Pi process (P3Env's MESH_GATEWAY in p3.env is the
# value actually consumed); this file documents the full addressing plan so
# the mesh UCI scripts (deploy/mesh/*.sh) and Pi static config agree.

MESH_ID=robot-mesh
MESH_SUBNET=192.168.10.0/24

ROBOT_ROUTER_IP=192.168.10.1
RELAY1_IP=192.168.10.2
RELAY2_IP=192.168.10.3
PI_STATIC_IP=192.168.10.10

OPERATOR_AP_SSID=robot-mesh-ap
OPERATOR_DHCP_START=192.168.10.50
OPERATOR_DHCP_END=192.168.10.99
