# ALSA configuration for P2's microphone capture.
#
# The PyAV wheel bundles its own libasound, built with a prefix of
# /tmp/vendor, so on its own it finds no alsa.conf and knows no device names
# at all ("default", "plughw:..." all fail with EIO). Pointing it at the
# system /usr/share/alsa/alsa.conf is no better: that pulls in PulseAudio and
# PipeWire plugins the bundled library cannot load. media.py points
# ALSA_CONFIG_PATH here instead, and this file defines only what P2 needs.
#
#   mic:CARD=U20,DEV=0   capture from that card, converting rate/channels
#                        (the same meaning as plughw:CARD=U20,DEV=0)
#
# FFmpeg's ALSA input asks for the smallest period the device allows, which
# for the robot's USB mic is 94 frames (~2 ms): ~500 reads a second, each
# through PyAV's demux/decode and aiortc's resampler, cost the capture thread
# over a third of a core. dsnoop fixes the hardware period at 20 ms (one Opus
# frame) and the client can't ask for anything smaller.

pcm.mic {
    @args [ CARD DEV ]
    @args.CARD {
        type string
    }
    @args.DEV {
        type integer
        default 0
    }
    type plug
    slave.pcm {
        type dsnoop
        ipc_key 5978293
        slave {
            pcm {
                type hw
                card $CARD
                device $DEV
            }
            rate 48000
            channels 1
            format S16_LE
            period_size 960
            buffer_size 7680
        }
    }
}

# dsnoop paces itself with an ALSA timer, and the bundled libasound only
# knows the timer names this file defines (without this: "Unknown timer
# hw:CLASS=3,..." and the mic fails to open with EIO).
timer.hw {
    @args [ CLASS SCLASS CARD DEV SUBDEV ]
    @args.CLASS { type integer default 0 }
    @args.SCLASS { type integer default 0 }
    @args.CARD { type integer default 0 }
    @args.DEV { type integer default 0 }
    @args.SUBDEV { type integer default 0 }
    type hw
    class $CLASS
    sclass $SCLASS
    card $CARD
    device $DEV
    subdevice $SUBDEV
}
