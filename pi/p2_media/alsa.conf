# ALSA configuration for P2's microphone capture.
#
# The PyAV wheel bundles its own libasound, built with a prefix of
# /tmp/vendor, so on its own it finds no alsa.conf and knows no device names
# at all ("default", "plughw:..." all fail with EIO). Pointing it at the
# system /usr/share/alsa/alsa.conf is no better: that pulls in PulseAudio and
# PipeWire plugins the bundled library cannot load. media.py points
# ALSA_CONFIG_PATH here instead, and this file defines only what P2 needs.
#
#   mic:CARD=U20,DEV=0   capture from that card, converting rate/channels
#                        (the same meaning as plughw:CARD=U20,DEV=0)

pcm.mic {
    @args [ CARD DEV ]
    @args.CARD {
        type string
    }
    @args.DEV {
        type integer
        default 0
    }
    type plug
    slave.pcm {
        type hw
        card $CARD
        device $DEV
    }
}
